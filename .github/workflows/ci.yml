name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (typecheck, integration tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @tiebreak/server typecheck
      # Testcontainers starts its own Postgres 17 in the runner's Docker: no secrets, never touches Neon.
      - run: yarn workspace @tiebreak/server test
      - run: yarn workspace @tiebreak/server build

  client:
    name: Client (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @tiebreak/client lint
      # `build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: yarn workspace @tiebreak/client build
